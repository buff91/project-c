display_information:
  name: Project-C Art Forge
  description: 게임 아트 생성부터 Aseprite 마감과 Unity 반영까지 관리
  background_color: "#17151f"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: project-c-art-forge
    always_online: false
  shortcuts:
    - name: 새 아트 생성
      type: global
      callback_id: art_new_job
      description: 등록된 Project-C 레시피로 후보 생성 작업을 만든다.
  slash_commands:
    - command: /art
      description: Project-C 아트 생성과 리뷰 큐 관리
      usage_hint: help | new | run <recipe-id> [count] | status
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - files:write
      - groups:history
      - reactions:read
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false

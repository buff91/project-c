schema_version: 1
id: env-ladder
name: 세워진 다층 사다리
slot: env-ladder
asset_type: environment
readability_goal: 바닥 타일이 아니라 여러 단을 잇는 별도 세로 랜드마크로 즉시 읽혀야 한다.
output:
  canvas: [64, 112]
  pivot: [0.5, 0.08]
  fit: contain
  anchor: bottom
  padding: 2
  trim_detached: false
prompt:
  positive: >-
    one upright salvaged maintenance ladder, narrow oxidized steel
    rails, clearly separated rungs, bent top hook, weighted feet, tall
    vertical isometric landmark
  negative: >-
    floor painting, horizontal ladder, stairs, scaffolding, wall, multiple
    ladders, cropped feet

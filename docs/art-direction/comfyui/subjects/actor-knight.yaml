schema_version: 1
id: actor-knight
name: 원정자
slot: actor-knight
asset_type: character

# 직업/영웅 선택은 없다. 런타임이 기존 씬 연결을 보존하려고 knight 슬롯을
# 단일 원정자 슬롯으로 우선 사용한다(IsoVisualCatalog.SurvivorSprite).

# 정체성 v2 (2026-07-30 채택): 필드 메딕 생존자 — 블론드+주황 팁 포니테일.
# 채택 근거·재현값은 docs/art-direction/reference/
# ref-cyberpunk-05-expeditioner-medic-concept.prompt.md 소유. 프롬프트는 v2 치비 레인
# (animagine 부루 태그 문법, 액터 계약 §4)이며, 의상 어휘는 navy 대신 charcoal을
# 쓴다(§3 실측 — 네이비 램프 부재로 틸 양자화됨).

readability_goal: >-
  주황 팁 포니테일 실루엣과 아군 얼굴(눈)이 96×128에서 읽혀야 하고, 힙 벨트의
  메디컬 파우치·숄더 사첼이 장비 연출을 방해하지 않는 빈손을 유지해야 한다.

prompt:
  positive: >-
    1girl, solo, field medic survivor, blonde messy short ponytail with orange
    tint tips, determined kind eyes, reworked white coat as patched short
    jacket with rolled sleeves, gray utility shirt, medical pouch on hip belt,
    shoulder satchel, fingerless gloves, dark charcoal leggings, sturdy boots,
    visible face, large bright expressive eyes, empty hands ready to show
    changing equipment
  signature_pose: >-
    grounded three-quarter isometric ready stance, knees slightly bent, one
    empty hand forward and the other near the hip belt
  negative: >-
    fantasy knight, royal armor, fixed character class, permanent signature
    weapon, giant sword, wizard robe, superhero suit, pristine military
    uniform, full-body neon glowing outfit, cyan outfit, glowing weapon,
    navy jacket, blue jacket, teal jacket, teal trousers, red jacket,
    red trousers, broad signal-color clothing, oversized backpack,
    gas mask worn on face, mask over mouth, covered eyes, hidden eyes,
    weapon, baseball bat

guides:
  # 이미 게임에서 검증된 정적 원정자를 production bootstrap의 identity
  # anchor로 사용하되, 옛 직업 장비 영역은 magenta로 비워 새 양손을 생성한다.
  # 이후 승인된 base 후보는 job이 이 입력을 덮는다.
  style_source: >-
    docs/art-direction/comfyui/guides/actor-survivor-neutral-source-512-v1.png
  pose: docs/art-direction/comfyui/guides/openpose/actor-survivor-idle.png

# 현재 런타임의 상태 태그 골격은 인간형끼리 공유한다. 최종 손·장비 위치와
# 실루엣은 승인본을 기준으로 Aseprite에서 고친다.
pose_guides:
  idle: docs/art-direction/comfyui/guides/openpose/actor-survivor-idle.png
  idle-breathe: >-
    docs/art-direction/comfyui/guides/openpose/actor-survivor-idle-breathe.png
  walk-contact-a: >-
    docs/art-direction/comfyui/guides/openpose/actor-survivor-walk-contact-a.png
  walk-pass: >-
    docs/art-direction/comfyui/guides/openpose/actor-survivor-walk-pass.png
  walk-contact-b: >-
    docs/art-direction/comfyui/guides/openpose/actor-survivor-walk-contact-b.png
  attack-windup: >-
    docs/art-direction/comfyui/guides/openpose/actor-survivor-attack-windup.png
  attack-release: >-
    docs/art-direction/comfyui/guides/openpose/actor-survivor-attack-impact.png
  attack-recovery: >-
    docs/art-direction/comfyui/guides/openpose/actor-survivor-attack-recovery.png
  hit: docs/art-direction/comfyui/guides/openpose/actor-survivor-hit.png
  fall: docs/art-direction/comfyui/guides/openpose/actor-survivor-fall.png
  death: docs/art-direction/comfyui/guides/openpose/actor-survivor-death.png

quality_gates:
  silhouette_tags:
  - orange-tip-ponytail
  - hip-medical-pouch
  - shoulder-satchel
  - readable-friendly-face
  - free-hands
  reject_if:
  - permanent-signature-weapon
  - tower-shield
  - fantasy-knight
  - bright-modern-hiking-gear
  - mask-on-face
  - broad-teal-clothing
  - broad-red-clothing
  color_area_limits:
    teal-signal:
      colors:
      - '#14343A'
      - '#1C4347'
      - '#376A67'
      - '#3899A6'
      - '#4FA7A0'
      - '#9ADFE8'
      - '#C6F4F7'
      maximum_fraction: 0.04
    warning-signal:
      colors:
      - '#45100B'
      - '#A43122'
      - '#D8452A'
      - '#F0492A'
      maximum_fraction: 0.02

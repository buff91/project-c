prompt:
  positive: Pixel Art, polished chunky isometric pixel art game actor, full body single post-apocalyptic
    scavenger, three-quarter isometric view, crouched shoulders and compact backpack, practical patched
    concrete-gray and rust-brown clothing, one tiny warning-neon red equipment point, strong readable
    silhouette, feet visible and level, isolated centered character, flat solid magenta background, crisp
    hard edges, deliberate pixel clusters, restrained colors
  negative: multiple characters, cropped feet, ground shadow, scenery, floor, text, label, watermark,
    photorealism, smooth 3d, vector art, anti-aliasing haze, fantasy armor, medieval clothing, sword,
    shield, bow, neon overload, symmetrical front portrait, close-up

schema_version: 1
id: item-frost-shard
name: 냉각 코일
slot: item-frost-shard
asset_type: prop
readability_goal: 64×64과 HUD 32px 표시에서 냉각재 수류탄 조합용 냉각 코일로 즉시 읽혀야 한다.
output:
  canvas: [64, 64]
  pivot: [0.5, 0.125]
  fit: contain
  anchor: bottom
  padding: 3
prompt:
  positive: >-
    one compact industrial cooling-coil cartridge recovered by a survivor,
    squat dark gunmetal rectangular frame filling most of the image, a thick
    exposed copper microchannel coil looping across its front, short cyan
    coolant lines, one small pressure cap and side hose couplers, restrained
    frost only on the metal fittings, believable serviceable machine component
  negative: >-
    crystal, shard, ice sword, blade, gem, jewel, magic ice crystal, snowflake,
    ornate setting, glowing rune, transparent, translucent, see-through, glass,
    refraction, splash, liquid spray, scattered debris,
    large apparatus, pedestal, stand, control console, screen,
    shadow on the ground, glow under the object, ice pool,
    building, tower, architecture, diorama, miniature building,
    terrain base, ground tile, grass

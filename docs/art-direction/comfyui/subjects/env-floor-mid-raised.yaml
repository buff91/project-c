schema_version: 1
id: env-floor-mid-raised
name: 중반 아케이드 단차 바닥
slot: env-floor-mid-raised
asset_type: environment
readability_goal: 중반 바닥 재료를 유지하면서 밝은 전면 두께로 +1 단차가 읽혀야 한다.
output:
  canvas: [128, 64]
  pivot: [0.5, 0.5]
  fit: strict
  anchor: center
prompt:
  positive: >-
    exact 2:1 isometric raised floor tile, cracked arcade tile top,
    one readable shallow concrete front lip, sparse dried coolant stains,
    seamless side edges
  negative: >-
    tall block, stairs, floating platform, hole, wall, object pile

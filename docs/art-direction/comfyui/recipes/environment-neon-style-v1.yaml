schema_version: 1
id: environment-neon-style-v1
name: 아케이드 타워 환경 스타일 트랜스퍼 v1 (M5 네온 전환)
# environment-hospital-style-v1 계보 승계 — v0.3.3 사이버펑크 승격에 따라 재료 어휘를
# 아케이드 타워(죽은 네온 상가)로 교체한다. 실루엣·2:1 투영·셀 배치 보존 조항은 동일.
# 톤 기준: reference/ref-cyberpunk-* + project-c-combat-space-parking-target-v1.png.
# 네온은 광원 웅덩이/간판 포인트로만 — 바닥은 저채도 콘크리트 유지(§1-c 판독 규칙).
purpose:
  category: environment
  asset_type: environment
  slot: env-collapsed-transit-source
  use: gameplay-source-sheet
  readability_goal: >-
    기존 6셀 배치와 2:1 투영을 보존하면서 재료만 폐 아케이드 타워(콘크리트+죽은 테크+
    국소 네온)로 바꾼다. 바닥 저채도·신호색 판독 우선.
  animation_scope: static-source-sheet
output:
  canvas:
  - 1536
  - 1024
  pivot:
  - 0.5
  - 0.0
  fit: strict
  anchor: center
  padding: 0
  alpha_cutoff: 80
  palette: Assets/_Project/Art/Source/Aseprite/project-c-torchstone.gpl
  promotion: manual-processor
  processor: Tools/ArtPipeline/process_postapoc_environment_v2.py
  allow_replace: false
pipeline:
  type: sdxl-img2img
  workflow: docs/art-direction/comfyui/environment-styletransfer.api.json
  checkpoint: zavychromaxl_v100.safetensors
  bindings:
    checkpoint: 1.ckpt_name
    positive: 5.text
    negative: 6.text
    seed: 9.seed
    steps: 9.steps
    cfg: 9.cfg
    denoise: 9.denoise
    sampler: 9.sampler_name
    scheduler: 9.scheduler
  uploads:
    7.image: docs/art-direction/project-c-collapsed-transit-environment-source-v2.png
loras:
- name: project-c-isopixel-sdxl-v1.safetensors
  node: 2
  base_model: SDXL
  model_strength: 0.3
  clip_strength: 0.3
  purpose: 2:1 아이소메트릭 형태 유지
  attribution: Civitai model 149080 / version 166425
- name: project-c-envy-junkworld-xl01.safetensors
  node: 3
  base_model: SDXL
  model_strength: 0.15
  clip_strength: 0.15
  purpose: 녹·폐허 재질 — 네온 채도를 먹지 않게 병원판(0.25)보다 낮춘다
  attribution: Civitai model 233573 / version 263472
- name: project-c-pixelart-redmond-sdxl-v1-lite64.safetensors
  node: 4
  base_model: SDXL
  model_strength: 0.4
  clip_strength: 0.4
  purpose: 하드 픽셀 에지
  attribution: Civitai model 144684 / version 160844
controlnets: []
generation:
  width: 1536
  height: 1024
  sampler: dpmpp_2m
  scheduler: karras
  steps: 28
  cfg: 6.0
  denoise: 0.45
  candidates: 4
  seed_strategy: sequential-random-base
prompt:
  positive: >-
    Pixel Art, PixArFK, polished chunky isometric pixel art, exact 2:1 dimetric
    modular game assets, abandoned neon shopping arcade tower interior, cracked
    concrete in dark desaturated gray, scuffed shop-front panels, shuttered
    storefronts, dead signage boxes and broken holo panel frames, cable trays,
    one small flickering cyan neon strip and one magenta sign glow as local light
    pools only, saturated amber only for one emergency light, crisp hard edges,
    blue-black charcoal shadows, preserve exact source sheet cell positions,
    scale, perspective, silhouettes, spacing, and flat magenta background
  negative: >-
    pink floor, magenta floor, saturated floor, neon flood, fantasy masonry, wood
    planks, medieval iron straps, torches, arches, runes, neon overload, excessive
    dithering, white outline noise, photorealism, smooth 3d, vector look, text,
    letters, labels, watermark, overlapping cells, changed layout, changed
    projection, missing assets
quality_gates:
  exact_dimensions:
  - 1536
  - 1024
  preserve_layout: true
  preserve_projection: "2:1"
  reject_if:
  - overlapping-cells
  - missing-cell
  - fantasy-materials
  - neon-flooded-floor
review:
  slack_channel_env: SLACK_ART_CHANNEL_ID
  publish_requires: processor-review

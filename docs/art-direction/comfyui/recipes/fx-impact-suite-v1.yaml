schema_version: 1
id: fx-impact-suite-v1
name: 전투 이펙트 원천 키프레임 v1

purpose:
  category: effect
  slot: fx-impact-physical
  use: animation-source
  readability_goal: 상태/임팩트 슬롯에서 폭발 중심과 반경이 선명하게 보이고 과도한 반짝임이 없어야 한다.
  animation_scope: burst-and-loop

output:
  canvas: [24, 24]
  pivot: [0.5, 0.5]
  fit: contain
  anchor: center
  padding: 0
  alpha_cutoff: 80
  key_color: auto
  key_tolerance: 48
  # 파티클은 의도적으로 분리된 픽셀 덩어리를 포함하므로 최대 연결 성분만 남기면 안 된다.
  trim_detached: false
  palette: Assets/_Project/Art/Source/Aseprite/project-c-torchstone.gpl
  promotion: animation-review-only
  allow_replace: false

pipeline:
  type: sdxl-txt2img
  workflow: docs/art-direction/comfyui/actor-idle.api.json
  checkpoint: zavychromaxl_v100.safetensors
  bindings:
    checkpoint: 1.ckpt_name
    positive: 3.text
    negative: 4.text
    seed: 6.seed
    width: 5.width
    height: 5.height
    steps: 6.steps
    cfg: 6.cfg
    denoise: 6.denoise
    sampler: 6.sampler_name
    scheduler: 6.scheduler

generation:
  width: 768
  height: 768
  sampler: dpmpp_2m
  scheduler: karras
  steps: 28
  cfg: 6.5
  denoise: 1.0
  candidates: 4
  seed_strategy: sequential-random-base

prompt:
  positive: >-
    pixel art impact burst effect source, centered circular core, hard particle
    edges, flat solid pure magenta background, isolated cutout, no border,
    strong readable halo, clean silhouette, limited colors
  negative: >-
    blurry, smooth gradients, text, watermark, logo, label, realistic fire,
    photographic, anti-aliased haze, frame, border

quality_gates:
  require_transparency_after_prepare: true
  minimum_visible_pixels: 30
  maximum_visible_pixels: 1400
  reject_if: [cropped-centroid, too-many-pixels]

animation:
  sequence:
    - state: burst
      frame_count: 6
      fps: 30
      tags: [burst]
    - state: status-loop
      frame_count: 8
      fps: 12
      tags: [idle-loop]

effect_variants:
  variants:
    - id: fx-impact-physical
      label: physical impact core
      slot: fx-impact-physical
      output_canvas: [24, 24]
      prompt_suffix: ", pale concrete chips and compact white impact star"
    - id: fx-impact-fire
      label: fire impact core
      slot: fx-impact-fire
      output_canvas: [24, 24]
      prompt_suffix: ", fire embers and warm orange glow"
    - id: fx-impact-frost
      label: frost impact core
      slot: fx-impact-frost
      output_canvas: [24, 24]
      prompt_suffix: ", cyan ice shards and cool rim glow"
    - id: fx-impact-heavy
      label: heavy impact core
      slot: fx-impact-heavy
      output_canvas: [32, 32]
      prompt_suffix: ", heavy shockwave blast and large radial ring"
    - id: fx-status-burn
      label: burn status loop source
      slot: fx-status-burn
      output_canvas: [32, 24]
      prompt_suffix: ", looping status burn ring"
    - id: fx-status-freeze
      label: freeze status loop source
      slot: fx-status-freeze
      output_canvas: [32, 24]
      prompt_suffix: ", looping freeze status aura"

review:
  slack_channel_env: SLACK_ART_CHANNEL_ID
  publish_requires: explicit-button

schema_version: 1
id: actor-slinger-chibi-base-v1
name: 기업 보안 사수 치비 기본 스프라이트 4방향 v1 · 익명 정체성
# actor-chibi-base-v1 파생 — 비율·포즈·리뷰 계약은 동일, 정체성 블록만 교체.
# 적 계약(v0.3.4): 익명(바이저·호흡기, 얼굴 비노출) + warning IFF 포인트 1곳(§1-a) +
# §1-b 실루엣 — 견착한 소형 아크 카빈이 읽혀야 원거리 대응이 성립한다.
# 몸통 베이스색은 아군(핑크 라이더)과 명도 2단 이상 분리(어두운 저채도).
purpose:
  category: actor
  asset_type: concept
  slot: actor-concept
  use: concept
  readability_goal: >-
    익명 바이저·호흡기에 warning IFF 포인트 1곳, 견착한 소형 아크 카빈이
    96×128 실루엣에서 읽혀야 한다(§1-b). 아군과 몸통 명도 2단 분리.
  animation_scope: base-4dir
output:
  canvas:
  - 96
  - 128
  pivot:
  - 0.5
  - 0.04
  fit: contain
  anchor: bottom
  padding: 2
  alpha_cutoff: 80
  key_color: auto
  key_tolerance: 48
  trim_detached: true
  palette: Assets/_Project/Art/Source/Aseprite/project-c-torchstone.gpl
  normalize_rows:
    crown: 8
    feet: 122
  promotion: concept-only
  allow_replace: false
pipeline:
  type: sdxl-txt2img-openpose
  workflow: docs/art-direction/comfyui/actor-chibi-openpose-sdxl.api.json
  checkpoint: animagine-xl-4.0-opt.safetensors
  bindings:
    checkpoint: 1.ckpt_name
    positive: 3.text
    negative: 4.text
    seed: 9.seed
    steps: 9.steps
    cfg: 9.cfg
    sampler: 9.sampler_name
    scheduler: 9.scheduler
  shots:
  - id: idle-south
    label: idle · south (정면 3/4)
    seed_offset: 0
    prompt_suffix: ', facing viewer, three-quarter front view'
    uploads:
      5.image: docs/art-direction/comfyui/guides/openpose/actor-chibi-chibi-idle.png
  - id: idle-east
    label: idle · east (우향)
    seed_offset: 0
    prompt_suffix: ', facing right, three-quarter side view'
    uploads:
      5.image: docs/art-direction/comfyui/guides/openpose/actor-chibi-chibi-idle-east.png
  - id: idle-west
    label: idle · west (좌향)
    seed_offset: 0
    prompt_suffix: ', facing left, three-quarter side view'
    uploads:
      5.image: docs/art-direction/comfyui/guides/openpose/actor-chibi-chibi-idle-west.png
  - id: idle-north
    label: idle · north (등면)
    seed_offset: 0
    prompt_suffix: ', from behind, back view, rear armor and compact carbine visible'
    uploads:
      5.image: docs/art-direction/comfyui/guides/openpose/actor-chibi-chibi-idle-north.png
loras:
- name: project-c-pixelart-redmond-sdxl-v1-lite64.safetensors
  node: 2
  base_model: SDXL
  model_strength: 0.45
  clip_strength: 0.45
  purpose: 도트 클러스터와 하드 에지
  attribution: Civitai model 144684 / version 160844
controlnets:
- model: controlnet-openpose-sdxl-xinsir.safetensors
  loader_node: 6
  apply_node: 7
  strength: 0.9
  purpose: 치비 골격으로 비율·포즈 고정 (end_percent 0.8)
generation:
  width: 1024
  height: 1024
  sampler: euler_ancestral
  scheduler: karras
  steps: 28
  cfg: 5.0
  denoise: 1.0
  candidates: 2
  seed_strategy: sequential-random-base
prompt:
  positive: >-
    1boy, solo, chibi, pixel art, full body, standing, post-apocalyptic
    corporate security marksman, anonymous enemy, face fully hidden by a narrow
    opaque visor and sealed respirator, compact corporate-surplus armor over a
    charcoal tactical uniform, compact arc carbine held across the chest, short
    foregrip and small power cell magazine visible, worn amber unit chevron,
    exactly one tiny dark-red IFF lamp, gray-brown muted colors, isolated
    character, simple gray background, flat color, clean pixel clusters, safe,
    masterpiece, high score, great score, absurdres
  negative: >-
    lowres, bad anatomy, bad hands, text, error, missing finger, extra digits,
    fewer digits, cropped, worst quality, low quality, low score, bad score,
    average score, signature, watermark, username, blurry, realistic
    proportions, tall body, small head, multiple views, multiple characters,
    gradient background, scenery, photorealistic, 3d, neon overload, fully
    glowing outfit, visible face, visible eyes, cute face, colorful dyed hair,
    pink clothes, teal clothes, bright outfit, leather sling, slingshot, stone
    pouch, bow, sword, staff, hooded raider, pristine police uniform
quality_gates:
  require_transparency_after_prepare: true
  silhouette_tags:
  - grounded-feet
  - anonymous-mask
  - shouldered-carbine-readable
  - consistent-rows
  reject_if:
  - cropped-feet
  - extra-limbs
  - malformed-anatomy
  - visible-face
  - missing-carbine
review:
  slack_channel_env: SLACK_ART_CHANNEL_ID
  publish_requires: explicit-button

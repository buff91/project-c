prompt:
  positive: >-
    Project-C post-apocalyptic anomaly-dungeon world, abandoned concrete
    hospital, cracked sanitary tile, oxidized dark steel, exposed rebar,
    practical scavenged survival materials, blue-black charcoal shadows,
    restrained rust-orange wear, emergency amber and desaturated teal only as
    small functional signals
  negative: >-
    medieval fantasy, royal uniform, pristine modern military, glossy sci-fi
    armor, gothic cathedral, wood tavern, neon overload, clean modern
    hospital

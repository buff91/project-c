schema_version: 1
id: environment-styletransfer-v1
name: 환경 스타일 트랜스퍼 v1
applies_to:
- environment
use: gameplay-source-sheet
category: environment
animation_scope: static-source-sheet
output:
  canvas:
  - 1536
  - 1024
  pivot:
  - 0.5
  - 0.0
  fit: strict
  anchor: center
  padding: 0
  alpha_cutoff: 80
  palette: Assets/_Project/Art/Source/Aseprite/project-c-torchstone.gpl
  promotion: manual-processor
  processor: Tools/ArtPipeline/process_postapoc_environment_v2.py
  allow_replace: false
generation:
  width: 1536
  height: 1024
  sampler: dpmpp_2m
  scheduler: karras
  steps: 28
  cfg: 6.0
  denoise: 0.45
  candidates: 4
  seed_strategy: sequential-random-base
pipeline:
  type: sdxl-img2img
  workflow: docs/art-direction/comfyui/environment-styletransfer.api.json
  checkpoint: zavychromaxl_v100.safetensors
  bindings:
    checkpoint: 1.ckpt_name
    positive: 5.text
    negative: 6.text
    seed: 9.seed
    steps: 9.steps
    cfg: 9.cfg
    denoise: 9.denoise
    sampler: 9.sampler_name
    scheduler: 9.scheduler
prompt: {}
loras:
- name: project-c-isopixel-sdxl-v1.safetensors
  node: 2
  base_model: SDXL
  model_strength: 0.3
  clip_strength: 0.3
  purpose: 2:1 아이소메트릭 형태 유지
  attribution: Civitai model 149080 / version 166425
- name: project-c-envy-junkworld-xl01.safetensors
  node: 3
  base_model: SDXL
  model_strength: 0.25
  clip_strength: 0.25
  purpose: 녹, 고철, 폐허 재질
  attribution: Civitai model 233573 / version 263472
- name: project-c-pixelart-redmond-sdxl-v1-lite64.safetensors
  node: 4
  base_model: SDXL
  model_strength: 0.4
  clip_strength: 0.4
  purpose: 하드 픽셀 에지
  attribution: Civitai model 144684 / version 160844
quality_gates:
  exact_dimensions:
  - 1536
  - 1024
  preserve_layout: true
  preserve_projection: '2:1'
  reject_if:
  - overlapping-cells
  - missing-cell
  - fantasy-materials
review:
  slack_channel_env: SLACK_ART_CHANNEL_ID
  publish_requires: processor-review

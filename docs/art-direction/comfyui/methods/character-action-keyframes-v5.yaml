schema_version: 1
id: character-action-keyframes-v5
name: 런타임 액션 키프레임 v5 · identity/pose balance
applies_to:
- character
- animation
required_guides:
- pose
guide_roles:
- pose
use: animation-source
animation_scope: runtime-state-keyframes
category: actor
requires_source_candidate: true
output:
  canvas:
  - 96
  - 128
  pivot:
  - 0.5
  - 0.04
  fit: contain
  anchor: bottom
  padding: 2
  alpha_cutoff: 80
  key_color: auto
  key_tolerance: 48
  trim_detached: true
  palette: Assets/_Project/Art/Source/Aseprite/project-c-torchstone.gpl
  promotion: animation-review-only
  allow_replace: false
pipeline:
  type: sd15-img2img-openpose
  workflow: docs/art-direction/comfyui/actor-slinger-openpose.api.json
  checkpoint: dreamshaper_8.safetensors
  bindings:
    checkpoint: 1.ckpt_name
    positive: 3.text
    negative: 4.text
    seed: 9.seed
    steps: 9.steps
    cfg: 9.cfg
    denoise: 9.denoise
    sampler: 9.sampler_name
    scheduler: 9.scheduler
generation:
  width: 512
  height: 512
  sampler: dpmpp_2m
  scheduler: karras
  steps: 24
  cfg: 7.0
  denoise: 0.6
  candidates: 1
  seed_strategy: sequential-random-base
prompt:
  prefix: pixelart, exact same single male actor as the source image, preserve identical
  use_signature_pose: false
  suffix: shoulder silhouette, body proportions, palette and facing, change pose only according to OpenPose,
    feet visible on one baseline, flat pure magenta background touching every border, isolated cutout,
    hard pixel clusters
  negative: different character, changed costume, city skyline, scenery, buildings, props, floor, ground
    shadow, text, watermark, label, smooth anti-alias, blurry, photorealistic, 3d render, extra limbs,
    wrong body count, cropped feet, changed facing, multiple characters
loras:
- name: pixelartV3.safetensors
  node: 2
  base_model: SD 1.5
  model_strength: 0.35
  clip_strength: 0.3
  purpose: 동작이 부드러운 픽셀 실루엣 유지
controlnets:
- model: control_v11p_sd15_openpose_fp16.safetensors
  loader_node: 7
  apply_node: 8
  strength: 1.0
  purpose: 팔/다리 방향 고정
quality_gates:
  require_transparency_after_prepare: true
  minimum_visible_pixels: 1800
  maximum_visible_pixels: 4200
  silhouette_tags:
  - grounded-feet
  - raised-arm
  - readable-pose
  reject_if:
  - cropped-feet
  - extra-limbs
  - malformed-anatomy
  - perspective-bend
review:
  slack_channel_env: SLACK_ART_CHANNEL_ID
  publish_requires: explicit-button
  reaction_legend:
    thumbsup: style-fit
    thumbsdown: reject
    art: palette
    bone: anatomy
    soap: cleanup
    triangular_ruler: scale-pivot
    arrows_counterclockwise: variation
animation:
  draft:
    clips:
    - tag: idle
      loop: true
      fps: 6
      frames:
      - idle
    - tag: walk
      loop: true
      fps: 10
      frames:
      - walk-contact-a
      - walk-pass
      - walk-contact-b
      - walk-pass
    - tag: attack
      loop: false
      fps: 10
      frames:
      - attack-windup
      - attack-release
      - attack-recovery
    - tag: hit
      loop: false
      fps: 12
      frames:
      - hit
    - tag: fall
      loop: false
      fps: 8
      frames:
      - fall
    - tag: death
      loop: false
      fps: 8
      frames:
      - death
poses:
- id: idle
  label: idle · grounded
  seed_offset: 0
  prompt_suffix: ', balanced grounded idle pose, both feet on one baseline'
- id: walk-contact-a
  label: walk · contact A
  seed_offset: 0
  prompt_suffix: ', first wide readable walk contact pose, left stride'
- id: walk-pass
  label: walk · passing
  seed_offset: 0
  prompt_suffix: ', compact walk passing pose, body slightly raised'
- id: walk-contact-b
  label: walk · contact B
  seed_offset: 0
  prompt_suffix: ', opposite wide readable walk contact pose, right stride'
- id: attack-windup
  label: attack · windup
  seed_offset: 0
  prompt_suffix: ', attack windup, sling raised behind the head'
- id: attack-release
  label: attack · release
  seed_offset: 0
  prompt_suffix: ', attack release, sling arm extended forcefully forward'
- id: attack-recovery
  label: attack · recovery
  seed_offset: 0
  prompt_suffix: ', attack recovery, weight returning to grounded stance'
- id: hit
  label: hit reaction
  seed_offset: 0
  prompt_suffix: ', recoiling from a hit, readable backward body bend'
- id: fall
  label: fall transition
  seed_offset: 0
  prompt_suffix: ', falling sideways toward the floor, readable full body'
- id: death
  label: death key pose
  seed_offset: 0
  prompt_suffix: ', collapsed death key pose, full body lying on one baseline'
guide_variants:
  style_source: runtime-512

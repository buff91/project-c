schema_version: 1
id: effect-keyframes-v2
name: 원천 키프레임 v2 · 아이콘화 억제
applies_to:
- effect
use: animation-source
category: effect
animation_scope: burst-and-loop
output:
  canvas:
  - 24
  - 24
  pivot:
  - 0.5
  - 0.5
  fit: contain
  anchor: center
  padding: 0
  alpha_cutoff: 80
  key_color: auto
  key_tolerance: 48
  trim_detached: false
  palette: Assets/_Project/Art/Source/Aseprite/project-c-torchstone.gpl
  promotion: animation-review-only
  allow_replace: false
pipeline:
  type: sdxl-txt2img
  workflow: docs/art-direction/comfyui/actor-idle.api.json
  checkpoint: zavychromaxl_v100.safetensors
  bindings:
    checkpoint: 1.ckpt_name
    positive: 3.text
    negative: 4.text
    seed: 6.seed
    width: 5.width
    height: 5.height
    steps: 6.steps
    cfg: 6.cfg
    denoise: 6.denoise
    sampler: 6.sampler_name
    scheduler: 6.scheduler
generation:
  width: 768
  height: 768
  sampler: dpmpp_2m
  scheduler: karras
  steps: 28
  cfg: 6.5
  denoise: 1.0
  candidates: 1
  seed_strategy: sequential-random-base
prompt:
  prefix: Pixel Art, PixArFK, single compact gameplay VFX sprite, asymmetric broken outward motion, three
    to six chunky deliberate particle clusters, clear empty space between particles, isolated cutout,
    flat solid pure magenta background touching every image border, crisp hard pixel edges, restrained
    Project-C colors, readable after reduction to 24 pixels
  negative: UI icon, ability icon, badge, button, target reticle, mandala, magic portal, orb, complete
    circle, complete ring, concentric rings, radial symmetry, circular border, enclosing frame, opaque
    disc, decorative emblem, smooth gradient, blurry glow haze, text, watermark, logo, photographic, realistic
    fire, anti-aliasing
quality_gates:
  require_transparency_after_prepare: true
  minimum_visible_pixels: 30
  maximum_visible_pixels: 900
  reject_if:
  - ui-icon
  - complete-ring
  - concentric-rings
  - radial-symmetry
  - opaque-center
review:
  slack_channel_env: SLACK_ART_CHANNEL_ID
  publish_requires: explicit-button
animation:
  sequence:
  - state: burst
    frame_count: 6
    fps: 30
    tags:
    - burst
  - state: status-loop
    frame_count: 8
    fps: 12
    tags:
    - idle-loop
